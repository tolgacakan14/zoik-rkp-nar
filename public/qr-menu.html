<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Zoi Kırkpınar | Menü QR Kodu</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e8eee8;color:#214b41;font-family:Arial,sans-serif}.card{width:min(520px,calc(100% - 32px));padding:54px 42px 44px;border:1px solid #d6e0d7;border-radius:28px;background:#fbfaf4;text-align:center;box-shadow:0 30px 90px #24483e24}.brand{font:italic 58px/1 Georgia,serif;letter-spacing:-.07em}.location{display:block;margin-top:5px;font-size:10px;font-weight:700;letter-spacing:.42em}.title{margin:34px 0 8px;font:400 29px/1.15 Georgia,serif}.copy{margin:0 auto 24px;max-width:310px;color:#718079;font-size:13px;line-height:1.5}.qr{display:block;width:min(310px,80vw);height:auto;margin:auto;padding:16px;border:1px solid #dce5dc;border-radius:18px;background:#fff}.hint{display:block;margin-top:20px;color:#49675e;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.url{display:block;margin-top:9px;color:#839089;font-size:10px}.actions{display:flex;justify-content:center;gap:10px;margin-top:26px}.actions a{padding:12px 18px;border:1px solid #2b5c50;border-radius:999px;color:#2b5c50;font-size:12px;font-weight:700;text-decoration:none}.actions a:first-child{background:#2b5c50;color:#fff}@media print{body{background:#fff}.card{box-shadow:none}.actions{display:none}}@media(max-width:480px){.card{padding:40px 20px 34px}.brand{font-size:48px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">zoi</div><span class="location">KIRKPINAR</span>
    <h1 class="title">Menüyü keşfet</h1>
    <p class="copy">Güncel menü, fiyatlar ve nargile karışım deneyimi için kameranı QR koda doğrult.</p>
    <img class="qr" src="/qr/zoi-kirkpinar-menu.svg" alt="Zoi Kırkpınar dijital menü QR kodu">
    <span class="hint">Kameranı aç · Kodu okut</span>
    <span class="url">zoik-rkp-nar-v2gz.vercel.app</span>
    <div class="actions"><a href="/qr/zoi-kirkpinar-menu.svg" download="zoi-kirkpinar-menu-qr.svg">QR kodunu indir</a><a href="/">Menüyü aç</a></div>
  </main>
</body>
</html>
